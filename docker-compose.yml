services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: visionguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visionguard
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: visionguard_dev_password
    ports:
      - "5438:5432"
    volumes:
      - visionguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard -d visionguard"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visionguard-backend
    restart: unless-stopped
    environment:
      PORT: 6969
      DATABASE_URL: postgres://visionguard:visionguard_dev_password@postgres:5432/visionguard
      FACE_EMBEDDING_PROVIDER: hybrid
      FACE_EMBEDDING_URL: http://face-ai:8091/embed
      FACE_EMBEDDING_TIMEOUT_MS: 4500
      STREAM_GATEWAY_URL: http://stream-gateway:1984
      PUBLIC_STREAM_GATEWAY_URL: http://localhost:1984
      STREAM_GATEWAY_TIMEOUT_MS: 3500
      RTSP_FRAME_TIMEOUT_MS: 12000
      # Local (non-Docker) dev points this at ../stream-gateway/ffmpeg.exe (see backend/.env) -
      # that's a Windows binary and won't run here. This image's Dockerfile installs ffmpeg via
      # apk, so it's just on PATH.
      FFMPEG_BIN: ffmpeg
      BUSINESS_TIMEZONE: Asia/Dubai
    ports:
      - "6969:6969"
    depends_on:
      postgres:
        condition: service_healthy
      face-ai:
        condition: service_started
      stream-gateway:
        condition: service_started
    volumes:
      - visionguard_reports:/app/reports
    command: ["sh", "-c", "node backend/db/migrate.js && node backend/server.js"]

  worker:
    build:
      context: .
      dockerfile: polling-worker/Dockerfile
    container_name: visionguard-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://visionguard:visionguard_dev_password@postgres:5432/visionguard
      VISIONGUARD_API_BASE: http://backend:6969
      WORKER_INTERVAL_MS: 10000
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  face-ai:
    build:
      context: ./face-service
    container_name: visionguard-face-ai
    restart: unless-stopped
    environment:
      INSIGHTFACE_MODEL: buffalo_l
    ports:
      - "8091:8091"
    volumes:
      - visionguard_face_models:/models
  stream-gateway:
    image: alexxit/go2rtc:latest
    container_name: visionguard-stream-gateway
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./stream-gateway/go2rtc.docker.yaml:/config/go2rtc.yaml

  frontend:
    build:
      context: ./frontend
    container_name: visionguard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  visionguard_pgdata:
  visionguard_face_models:
  visionguard_reports:
