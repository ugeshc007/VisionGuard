# Local (non-Docker) config: runs go2rtc.exe directly against the Windows ffmpeg.exe
# next to it. Docker Compose mounts go2rtc.docker.yaml instead, since the
# alexxit/go2rtc container image ships its own Linux ffmpeg on PATH.
ffmpeg:
   bin: "./ffmpeg.exe"

api:
  listen: ":1984"

webrtc:
  listen: ":8555"

rtsp:
  listen: ":8554"

log:
  level: info

streams: {}
