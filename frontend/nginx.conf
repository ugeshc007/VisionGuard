server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS (127.0.0.11). Needed because proxy_pass with a
  # literal hostname resolves once at nginx startup - if the backend container
  # isn't up yet at that moment (or gets recreated with a new IP later),
  # nginx fails to start entirely ("host not found in upstream") instead of
  # just failing that one request. Routing proxy_pass through a variable
  # forces it through this resolver on every request instead.
  resolver 127.0.0.11 valid=10s;

  # Same role as vite.config.js's dev-server proxy: the app calls relative
  # /api/... paths and expects same-origin, so nginx has to forward those to
  # the backend service instead of trying to serve them as static files.
  location /api/ {
    set $backend http://backend:6969;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback for react-router-dom client-side routes (e.g. a hard refresh
  # on /cameras would otherwise 404 since there's no such file on disk).
  location / {
    try_files $uri /index.html;
  }
}
